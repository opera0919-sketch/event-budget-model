# 예시 명세 — 실제 삼성 POP 이벤트 상세가 제공되면 이 형식으로 작성/대체한다.
# (연금저축·IRP 외의 통상 증권사 이벤트 구조를 함께 보여주는 참고용 템플릿)
event_id: example_samsungpop
title: (예시) 삼성 POP 이벤트

history_csv: data/history.csv
forecast_rounds: ["2026_03"]

products:
  - name: pension
    label: 연금저축 신규/이전 이벤트
    base_col_end: pension_end
    applicants_col: pension_applicants
    avg_reward: 45000        # 예: 신청 조건 충족 시 평균 45,000원 상당 지급
    fixed_costs: 5000000     # 배너 제작·경품 배송 등
    tax_rate: 0.22           # 경품(실물/상품권)이면 제세공과금 22%

levers:
  goal_achievement: [0.8, 1.0, 1.2]
  reward_payout_rate: [0.6, 0.7, 0.8]

# 참고: 계좌개설/입금/거래/추첨/출석 등 다른 mechanic은 budget.compute_payout_tiered로
# 티어·캡(선착순 N / 추첨 N / 예산상한)을 적용할 수 있다. docs/methodology.md 참조.
