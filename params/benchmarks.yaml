# 벤치마크 사전값 라이브러리
# - take_rate: 상품별/시즌별 신청자÷기준고객수 비율의 사전값(fallback).
#   data/history.csv 실측이 있으면 calibrate가 이 값을 덮어씀(보정).
# - 시즌 코드: 1=_01(2~4월), 2=_02(5~7월), 3=_03(8~10월), 4=_04(11~1월, 연말정산 성수기)
# - blend_recent_weight: 시즌평균과 최근추세를 섞는 가중치(최근추세 반영도).
# - min_cv: 시나리오 밴드(보수/낙관)를 만들 때 take_rate 변동계수 하한.

take_rate:
  pension:               # 연금저축
    1: 0.0122
    2: 0.0103
    3: 0.0094
    4: 0.0129
  irp:                   # IRP
    1: 0.0158
    2: 0.0280
    3: 0.0234
    4: 0.0437

blend_recent_weight: 0.5   # 기준 take_rate = 0.5*시즌평균 + 0.5*최근추세
recent_window: 4           # 최근추세 = 최근 4개 관측 회차 take_rate 평균
min_cv: 0.15               # 시나리오 밴드 최소 변동계수
exclude_rounds:           # take_rate 산정에서 제외할 파일럿/초기 회차
  - "2024_03"

# 예산 시나리오 레버 기본값(이벤트 명세에서 덮어쓸 수 있음)
levers:
  goal_achievement: [0.8, 1.0, 1.2]      # 보수/기준/낙관
  reward_payout_rate: [0.6, 0.7, 0.8]
  # avg_reward 는 상품/이벤트별로 명세에서 지정(원)
